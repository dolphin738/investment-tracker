[pytest]
# pytest-asyncio 1.x 配置
# strict：async 测试需显式 @pytest.mark.asyncio（现有测试已标）
# asyncio_default_test_loop_scope=session：
#   整个测试 session 复用单一事件循环，避免 asyncpg 连接池跨 function 循环失效
#   （多 async 测试共享全局 AsyncSessionLocal 时，连接池绑定旧 loop 会抛 Event loop is closed）
asyncio_mode = strict
asyncio_default_test_loop_scope = session
