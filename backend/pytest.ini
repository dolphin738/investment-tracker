[pytest]
# pytest-asyncio 1.x 配置
# strict：async 测试需显式 @pytest.mark.asyncio（现有测试已标）
# asyncio_default_test_loop_scope=function：
#   async 测试与 async 夹具共用「同一 function 循环」，规避 pytest-asyncio 在
#   session 作用域下「夹具跑 session 循环 / 测试跑 function 循环」的错位，从而
#   避免 asyncpg 连接绑定到不同 loop 报 “attached to a different loop”。
#   代价：每次测试重建引擎（见 conftest 的 _engine 夹具），不跨测试复用连接池。
asyncio_mode = strict
asyncio_default_test_loop_scope = function
