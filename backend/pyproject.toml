[project]
name = "investment-return-tracker-backend"
version = "0.1.0"
description = "投资收益统计系统 — Python 后端 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "greenlet==3.1.1",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "pyxirr==0.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
