[project]
name = "investment-return-tracker-backend"
version = "0.1.0"
description = "投资收益统计系统 — Python 后端 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "greenlet==3.1.1",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "pyxirr==0.10.8",
    "openpyxl==3.1.5",
    # SDK 行情接入（ADR-002 §5 第 5 步）：akshare 懒导入，未安装不影响启动
    "akshare>=1.14",
    # 证券主数据拼音首字母（录入界面按拼音搜索）：sync_security_masters 计算 pinyin_initials
    "pypinyin>=0.53",
    # 可选定时调度器（收盘后全量同步行情），默认关闭、懒导入
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    # starlette 1.4 testclient 首选 httpx2（httpx 官方延续版，pydantic 团队维护）；
    # 装上即消除 StarletteDeprecationWarning
    "httpx2==2.9.1",
    # 架构边界强制：层契约（import-linter）+ 接入 pytest 的 tests/test_import_linter.py
    "import-linter>=2.13,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

# 本项目是 FastAPI 应用（非可分发包），明确声明不构建自身，
# 否则 `uv sync` 会尝试把 backend 当可安装包去构建而报错。
[tool.uv]
package = false
