[project]
name = "investment-return-tracker-backend"
version = "0.1.0"
description = "投资收益统计系统 — Python 后端 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "greenlet==3.1.1",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "pyxirr==0.10.8",
    "openpyxl==3.1.5",
    # SDK 行情接入（ADR-002 §5 第 5 步）：akshare 懒导入，未安装不影响启动
    "akshare>=1.14",
    # 证券主数据拼音首字母（录入界面按拼音搜索）：sync_security_masters 计算 pinyin_initials
    "pypinyin>=0.53",
    # 可选定时调度器（收盘后全量同步行情），默认关闭、懒导入
    "apscheduler>=3.10",
    # 行情同步 / 调度器运行时 HTTP 客户端（非仅测试用，REP-004：scheduler.py / market_data_sync.py 顶层 import）
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio==1.4.0",
    # starlette 1.4 testclient 首选 httpx2（httpx 官方延续版，pydantic 团队维护）；
    # 装上即消除 StarletteDeprecationWarning
    "httpx2==2.9.1",
    # 架构边界强制：层契约（import-linter）+ 接入 pytest 的 tests/test_import_linter.py
    "import-linter>=2.13,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 阶段4 Lint 闸门（防反弹工程规则）：仅启用 Pyflakes（F）——未使用 import/变量、
# 未定义名（unused-imports / unused-vars 设为 error）。有意保持最小集，
# 避免一次性引入风格类规则（import 排序、类型升级建议等）造成海量存量噪音；
# 后续如需扩展在 select 追加并先清零基线。
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy 模型的字符串前向引用（如 Mapped["Portfolio"]）由 ORM registry
# 运行时解析，ruff 无法静态解析 → 模型层豁免 F821（未定义名）。
"app/models/*" = ["F821"]

# 本项目是 FastAPI 应用（非可分发包），明确声明不构建自身，
# 否则 `uv sync` 会尝试把 backend 当可安装包去构建而报错。
[tool.uv]
package = false
